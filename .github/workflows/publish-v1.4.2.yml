name: Publish Bicycle Plus v1.4.2

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - RELEASE_NOTES_v1.4.2.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bicycle-plus-release-v1.4.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'moocd123/gen1recomp-bicycle-plus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact public source commit
        env:
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${REPO}.git" source
          git -C source checkout --detach "$SOURCE_SHA"

      - name: Validate update metadata and build the installable ZIP
        working-directory: source
        run: python3 .github/scripts/build_release.py

      - name: Publish v1.4.2 without overwriting existing releases
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view v1.4.2 >/dev/null 2>&1; then
            echo 'v1.4.2 already exists; no existing release was modified.'
          else
            gh release create v1.4.2 \
              dist/bicycle_plus-1.4.2.zip \
              dist/SHA256SUMS.txt \
              --target "$SOURCE_SHA" \
              --title 'Bicycle Plus v1.4.2' \
              --notes-file RELEASE_NOTES_v1.4.2.md \
              --latest
          fi
          gh release view v1.4.2 --json url,tagName,assets

      - name: Download the published assets and verify their bytes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download v1.4.2 --pattern 'bicycle_plus-1.4.2.zip' --pattern 'SHA256SUMS.txt' --dir downloaded
          cmp dist/bicycle_plus-1.4.2.zip downloaded/bicycle_plus-1.4.2.zip
          cmp dist/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          cd downloaded
          sha256sum --check SHA256SUMS.txt
