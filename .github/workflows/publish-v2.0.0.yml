name: Publish AUTOBIKE+ v2.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/staging/autobike-v2.0.0/**
      - .github/workflows/publish-v2.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autobike-release-v2.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'moocd123/gen1recomp-bicycle-plus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact authorised source and pinned base objects
        env:
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${REPO}.git" source
          git -C source checkout --detach "$SOURCE_SHA"
          git -C source cat-file -e 9233e841e16bae164e3163840aa0c876d6c1537b^{commit}
          git -C source cat-file -e 79f920167249fe9bc082ef495446ce35b3eaac51^{commit}

      - name: Restore approved source with exact input and output hashes
        working-directory: source
        run: python3 .github/staging/autobike-v2.0.0/restore.py

      - name: Obtain pinned v0.3.36 engine for native-module checks
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.3
          git clone --depth 1 --filter=blob:none --sparse --branch v0.3.36 https://github.com/bryanthaboi/gen1recomp.git engine
          test "$(git -C engine rev-parse HEAD)" = 8cb3677a8a28df68a678fdac741ca1de216e0168
          git -C engine sparse-checkout set src data

      - name: Compile and verify profiles, upgrade isolation and stable updater identity
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          for path in json.load(open('verification/v2.0.0/runtime-sha256.json'))['runtime']:
              subprocess.run(['luac5.3', '-p', path], check=True)
          print('PASS: all 37 runtime modules compile.')
          PY
          lua5.3 verification/v2.0.0/check_profiles.lua ../engine .
          lua5.3 verification/v2.0.0/check_upgrade.lua ../engine .
          lua5.3 verification/v2.0.0/check_identity.lua ../engine .

      - name: Build the exact locally accepted source-only ZIP
        working-directory: source
        run: |
          set -euo pipefail
          python3 .github/scripts/build_v2_release.py
          echo 'bd7e3f96a47153f3821b1893bc9168c15c73ab271ea752ceff1610f1022f6b16  dist/bicycle_plus-2.0.0.zip' | sha256sum --check
          cp verification/v2.0.0/package_acceptance.json dist/PACKAGE_ACCEPTANCE.json

      - name: Commit verified source without overwriting concurrent changes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo 'Release v2.0.0 already exists; refusing to overwrite it.'
            exit 1
          fi
          test -z "$(git ls-remote origin refs/tags/v2.0.0)"
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess
          stage = Path('.github/staging/autobike-v2.0.0')
          paths = json.loads((stage/'source-paths.json').read_text())
          assert len(paths) == 49
          subprocess.run(['git', 'add', '--', *paths], check=True)
          shutil.rmtree(stage)
          subprocess.run(['git', 'add', '-u', '--', str(stage)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish AUTOBIKE+ v2.0.0 unified games and shared profiles' -m 'Promote approved Test 3 with stable updater identity and verified test-to-public profile/audio adoption. Retain Surf remount and imported-only catalogues. Public source hashes, profiles, migration and metadata checks passed.'
          gh auth setup-git
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish latest regular release without changing earlier releases
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo 'Release v2.0.0 already exists; refusing to overwrite it.'
            exit 1
          fi
          test -z "$(git ls-remote origin refs/tags/v2.0.0)"
          gh release create v2.0.0 dist/bicycle_plus-2.0.0.zip dist/SHA256SUMS.txt dist/PACKAGE_ACCEPTANCE.json \
            --target "$RELEASE_SHA" --title 'AUTOBIKE+ v2.0.0 - Gen 3 and shared profiles' \
            --notes-file RELEASE_NOTES_v2.0.0.md --latest
          gh release view v2.0.0 --json url,tagName,assets

      - name: Download published assets and verify their exact bytes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download v2.0.0 --pattern 'bicycle_plus-2.0.0.zip' --pattern 'SHA256SUMS.txt' --pattern 'PACKAGE_ACCEPTANCE.json' --dir downloaded
          cmp dist/bicycle_plus-2.0.0.zip downloaded/bicycle_plus-2.0.0.zip
          cmp dist/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          cmp dist/PACKAGE_ACCEPTANCE.json downloaded/PACKAGE_ACCEPTANCE.json
          cd downloaded
          sha256sum --check SHA256SUMS.txt
