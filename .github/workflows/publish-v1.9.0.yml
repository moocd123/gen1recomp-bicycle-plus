name: Publish AUTOBIKE+ v1.9.0

on:
  push:
    branches: [main]
    paths:
      - .github/staging/autobike-v1.9.0/**
      - .github/workflows/publish-v1.9.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autobike-release-v1.9.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'moocd123/gen1recomp-bicycle-plus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact authorised source commit
        env:
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${REPO}.git" source
          git -C source checkout --detach "$SOURCE_SHA"

      - name: Restore reviewed source and verify exact file hashes
        working-directory: source
        run: python3 .github/staging/autobike-v1.9.0/restore.py

      - name: Obtain pinned engine and real audio test runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.3 love xvfb xauth ffmpeg
          git clone --depth 1 --filter=blob:none --sparse --branch v0.2.60 https://github.com/bryanthaboi/gen1recomp.git engine
          test "$(git -C engine rev-parse HEAD)" = '4dadfd55a88e796c15fa7549b7c56e60e7c9b6d5'
          git -C engine sparse-checkout set src data

      - name: Native sandbox, importer, menu, storage and audio tests
        working-directory: source
        run: |
          set -euo pipefail
          for source in ./*.lua; do luac5.3 -p "$source"; done
          for test in check_library_sandbox check_import_picker check_menu check_updater; do
            lua5.3 "verification/v1.9.0/${test}.lua" ../engine
          done
          for edition in red blue yellow gold silver crystal; do
            lua5.3 verification/v1.9.0/check_audio.lua ../engine "$edition"
          done

      - name: Real LÖVE codec, FileData streaming and cache integration
        run: |
          set -euo pipefail
          mkdir tones
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:duration=1' -ar 44100 -ac 2 tones/test.wav
          ffmpeg -v error -i tones/test.wav -c:a libvorbis tones/test.ogg
          ffmpeg -v error -i tones/test.wav -c:a libmp3lame tones/test.mp3
          ffmpeg -v error -i tones/test.wav -c:a flac tones/test.flac
          export ALSOFT_DRIVERS=null
          timeout 90s xvfb-run -a love "$PWD/source/verification/v1.9.0/love_test" "$PWD/source" "$PWD/engine" "$PWD/tones"

      - name: Build only reviewed source and documentation
        working-directory: source
        run: python3 .github/scripts/build_autobike_release.py

      - name: Commit verified source without overwriting concurrent changes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess
          stage = Path('.github/staging/autobike-v1.9.0')
          files = list(json.loads((stage / 'target-sha256.json').read_text()))
          subprocess.run(['git', 'add', '--', *files], check=True)
          shutil.rmtree(stage)
          subprocess.run(['git', 'add', '-u', '--', str(stage)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish AUTOBIKE+ v1.9.0 menus and sandbox-aware music repairs' -m 'Restore native audio settings and one mod settings tree. Repair imported FileData playback and foreign-program cache visibility. Native sandbox and real LÖVE codec tests passed before publication.'
          gh auth setup-git
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish latest release without overwriting existing releases
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.9.0 >/dev/null 2>&1; then
            echo 'v1.9.0 already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v1.9.0 dist/bicycle_plus-1.9.0.zip dist/SHA256SUMS.txt \
            --target "$RELEASE_SHA" --title 'AUTOBIKE+ v1.9.0 - Menus and music repair' \
            --notes-file RELEASE_NOTES_v1.9.0.md --latest
          gh release view v1.9.0 --json url,tagName,assets

      - name: Download released assets and verify exact bytes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download v1.9.0 --pattern 'bicycle_plus-1.9.0.zip' --pattern 'SHA256SUMS.txt' --dir downloaded
          cmp dist/bicycle_plus-1.9.0.zip downloaded/bicycle_plus-1.9.0.zip
          cmp dist/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          cd downloaded
          sha256sum --check SHA256SUMS.txt
