name: Publish AUTOBIKE+ v1.9.2

on:
  push:
    branches: [main]
    paths:
      - .github/staging/autobike-v1.9.2/**
      - .github/workflows/publish-v1.9.2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autobike-release-v1.9.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'moocd123/gen1recomp-bicycle-plus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact authorised source commit
        env:
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${REPO}.git" source
          git -C source checkout --detach "$SOURCE_SHA"

      - name: Apply reviewed source with base and target hash checks
        working-directory: source
        run: python3 .github/staging/autobike-v1.9.2/restore.py

      - name: Obtain pinned engine for native-module regression tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.3
          git clone --depth 1 --filter=blob:none --sparse --branch v0.2.60 https://github.com/bryanthaboi/gen1recomp.git engine
          test "$(git -C engine rev-parse HEAD)" = '4dadfd55a88e796c15fa7549b7c56e60e7c9b6d5'
          git -C engine sparse-checkout set src data

      - name: Test fresh installs, existing preferences, first ride and update metadata
        working-directory: source
        run: |
          set -euo pipefail
          for file in ./*.lua; do luac5.3 -p "$file"; done
          lua5.3 verification/v1.9.2/check_defaults.lua ../engine
          lua5.3 verification/v1.9.2/check_first_ride.lua ../engine
          lua5.3 verification/v1.9.2/check_updater.lua ../engine
          lua5.3 verification/v1.9.0/check_library_sandbox.lua ../engine
          lua5.3 verification/v1.9.0/check_import_picker.lua ../engine
          for edition in red blue yellow gold silver crystal; do
            lua5.3 verification/v1.9.1/check_mode_audio.lua ../engine "$edition"
            lua5.3 verification/v1.9.0/check_audio.lua ../engine "$edition"
          done

      - name: Build and verify the source-only release
        working-directory: source
        run: python3 .github/scripts/build_autobike_release.py

      - name: Commit verified source without overwriting concurrent changes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess
          stage = Path('.github/staging/autobike-v1.9.2')
          files = []
          for path in sorted(stage.glob('ops*.json')):
              files.extend(entry['path'] for entry in json.loads(path.read_text()))
          subprocess.run(['git', 'add', '--', *files], check=True)
          shutil.rmtree(stage)
          subprocess.run(['git', 'add', '-u', '--', str(stage)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish AUTOBIKE+ v1.9.2 first-install defaults' -m 'Default new installs to auto-bike ON and BICYCLE routing. Copy normal Music volume only when bike volume is unsaved, preserving OFF and all existing preferences. Native first-run, reinstall, routing and storage regressions passed.'
          gh auth setup-git
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish latest release without overwriting previous releases
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.9.2 >/dev/null 2>&1; then
            echo 'v1.9.2 already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v1.9.2 dist/bicycle_plus-1.9.2.zip dist/SHA256SUMS.txt \
            --target "$RELEASE_SHA" --title 'AUTOBIKE+ v1.9.2 - First-install defaults' \
            --notes-file RELEASE_NOTES_v1.9.2.md --latest
          gh release view v1.9.2 --json url,tagName,assets

      - name: Download published assets and verify exact bytes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download v1.9.2 --pattern 'bicycle_plus-1.9.2.zip' --pattern 'SHA256SUMS.txt' --dir downloaded
          cmp dist/bicycle_plus-1.9.2.zip downloaded/bicycle_plus-1.9.2.zip
          cmp dist/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          cd downloaded
          sha256sum --check SHA256SUMS.txt
