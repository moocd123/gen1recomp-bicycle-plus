name: Publish Bicycle Plus v1.8.0

on:
  push:
    branches: [main]
    paths:
      - .github/release-staging/v1.8.0/**
      - .github/workflows/publish-v1.8.0.yml
      - manifest.json
      - RELEASE_NOTES_v1.8.0.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bicycle-plus-release-v1.8.0
  cancel-in-progress: false

env:
  EXPECTED_ZIP: 0902d0bc434f12afca6cd8719aefcaa6e920cca63d3eff39eea4b1253f805032

jobs:
  publish:
    if: github.repository == 'moocd123/gen1recomp-bicycle-plus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact authorized source commit
        env:
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${REPO}.git" source
          git -C source checkout --detach "$SOURCE_SHA"

      - name: Restore reviewed source with patch and per-file hashes
        working-directory: source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess, tempfile
          root = pathlib.Path('.')
          staging = root / '.github/release-staging/v1.8.0'
          if not staging.exists():
              assert json.loads((root / 'manifest.json').read_text())['version'] == '1.8.0'
              print('Source is already installed; proceeding to verification.')
              raise SystemExit(0)
          plan = json.loads((staging / 'plan.json').read_text())
          assert plan['baseline'] == 'ba08de57e2715cb28dae59b3b118cc004b4c62d5'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == plan['baseline']
          assert len(plan['files']) == 31
          for name in plan['files']:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert not name.startswith('.github/workflows/')
          encoded = ''.join((staging / f'part-{i:02d}.b64').read_text().strip() for i in range(8))
          assert len(encoded) == 54572
          packed = base64.b64decode(encoded, validate=True)
          assert len(packed) == 40928
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch = decoder.decompress(packed, max_length=200001)
          assert decoder.eof and not decoder.unused_data and len(patch) == 149300
          assert hashlib.sha256(patch).hexdigest() == plan['patch_sha256'] == '665364c4bf1ebfee1c757e16974696576cb59de09f32b53cbabb931cf99e8899'
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch); f.flush()
              subprocess.run(['git', 'apply', '--check', '--index', f.name], check=True)
              subprocess.run(['git', 'apply', '--index', f.name], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(changed) == set(plan['files'])
          for name, expected in plan['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          print('PASS: reviewed source patch and all 31 changed-file hashes; no workflow edits in patch.')
          PY

      - name: Obtain pinned engine source for native-module checks
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.3 openssl
          git clone --depth 1 --filter=blob:none --sparse --branch v0.2.60 https://github.com/bryanthaboi/gen1recomp.git engine
          test "$(git -C engine rev-parse HEAD)" = '4dadfd55a88e796c15fa7549b7c56e60e7c9b6d5'
          git -C engine sparse-checkout set src data

      - name: Test library, platform routing, menus, storage isolation and audio transitions
        working-directory: source
        run: |
          set -euo pipefail
          for suite in check_library check_file_pickers check_menu check_native_audio_menu check_updater check_safety; do
            lua5.3 "verification/v1.8.0/${suite}.lua" ../engine
          done
          for edition in red blue yellow gold silver crystal; do
            lua5.3 verification/v1.8.0/check_audio.lua ../engine "$edition"
          done

      - name: Build and verify reviewed source-only package
        working-directory: source
        run: |
          set -euo pipefail
          python3 .github/scripts/build_music_release.py
          echo "$EXPECTED_ZIP  dist/bicycle_plus-1.8.0.zip" | sha256sum --check -

      - name: Commit verified source without overwriting concurrent changes
        id: source
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if test -d .github/release-staging/v1.8.0; then
            git rm -r -- .github/release-staging/v1.8.0
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish reviewed Bicycle Plus v1.8.0 custom cycling songs' \
              -m 'Add local audio importing, supported imported-game soundtracks and playback controls. Preserve progress-save handling and opt in to custom music. Automated tests passed; release notes request backup and real-device testing.'
            gh auth setup-git
            git push origin HEAD:refs/heads/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish normal latest release with a prominent testing notice
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINAL_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view v1.8.0 >/dev/null 2>&1; then
            echo 'v1.8.0 exists; its tag, release and assets were not overwritten.'
          else
            gh release create v1.8.0 dist/bicycle_plus-1.8.0.zip dist/SHA256SUMS.txt \
              --target "$FINAL_SHA" --title 'Bicycle Plus v1.8.0 - Custom cycling songs' \
              --notes-file RELEASE_NOTES_v1.8.0.md --latest
          fi
          gh release view v1.8.0 --json url,tagName,assets,isPrerelease

      - name: Download published assets and verify exact bytes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download v1.8.0 --pattern 'bicycle_plus-1.8.0.zip' --pattern 'SHA256SUMS.txt' --dir downloaded
          cmp dist/bicycle_plus-1.8.0.zip downloaded/bicycle_plus-1.8.0.zip
          cmp dist/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          cd downloaded
          sha256sum --check SHA256SUMS.txt
